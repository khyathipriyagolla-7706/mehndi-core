<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mehndi Core | Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f1e3;
            color: #3b4a31;
        }

        header {
            background: #3b4a31;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        #logoutBtn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #3b4a31;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h2 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #777;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .stat-card h3 {
            font-size: 15px;
            color: #777;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 30px;
            font-weight: bold;
        }

        .bookings-section {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        .bookings-section h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f0e7d3;
        }

        td {
            color: #555;
        }

        .status {
            font-weight: bold;
        }

        #message {
            text-align: center;
            padding: 20px;
            color: #777;
        }

        @media (max-width: 700px) {
            header {
                padding: 18px;
            }

            .container {
                width: 94%;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .welcome h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Mehndi Core</h1>

        <button id="logoutBtn">
            Logout
        </button>
    </header>

    <main class="container">

        <div class="welcome">
            <h2>Admin Dashboard</h2>
            <p>Manage and view customer booking requests.</p>
        </div>

        <section class="stats">

            <div class="stat-card">
                <h3>Total Bookings</h3>
                <p id="totalBookings">0</p>
            </div>

            <div class="stat-card">
                <h3>Pending</h3>
                <p id="pendingBookings">0</p>
            </div>

            <div class="stat-card">
                <h3>Confirmed</h3>
                <p id="confirmedBookings">0</p>
            </div>

        </section>

        <section class="bookings-section">

            <h2>Booking Requests</h2>

            <div id="message">
                Loading bookings...
            </div>

            <table id="bookingsTable" style="display: none;">

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Service</th>
                        <th>Date</th>
                        <th>Address</th>
                        <th>Notes</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="bookingsBody">
                </tbody>

            </table>

        </section>

    </main>

    <script src="dashboard.js"></script>

</body>
</html>
